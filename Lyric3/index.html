<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Aurora Drift — Cinematic Galaxy Lyric</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="rig" class="rig">

  <canvas id="cosmos-canvas" class="layer layer-cosmos"></canvas>

  <canvas id="galaxy-canvas" class="layer layer-galaxy"></canvas>

  <canvas id="fx-canvas" class="layer layer-fx"></canvas>

  <div class="lyric-wrap layer">
    <div id="lyric-eyebrow" class="lyric-eyebrow"></div>
    <div id="lyric-line" class="lyric-line" aria-live="polite"></div>
  </div>

</div>

<div class="vignette"></div>
<div class="grain"></div>
<div class="scanline-glow"></div>

<div id="intro-hint" class="intro-hint">gerakkan kursor · sentuh layar · klik untuk kembang api</div>

<script src="script.js" defer></script>
</body>
</html>
